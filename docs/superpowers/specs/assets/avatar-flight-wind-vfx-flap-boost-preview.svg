<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
  <title id="title">AvatarFlight Flap and Boost Wind VFX Preview</title>
  <desc id="desc">Side-by-side planning visualization for flap downwash and boost horizontal compression wind effects.</desc>
  <defs>
    <linearGradient id="panelBg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#101722"/>
      <stop offset=".66" stop-color="#172029"/>
      <stop offset="1" stop-color="#202a24"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#243521"/>
      <stop offset="1" stop-color="#35462b"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#dff8ff" stop-opacity="0"/>
      <stop offset=".74" stop-color="#dff8ff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".95"/>
    </linearGradient>
    <filter id="soft" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <g id="drake">
      <ellipse cx="0" cy="0" rx="68" ry="24" fill="#2f4858"/>
      <ellipse cx="-76" cy="-8" rx="78" ry="18" fill="#5e7e8f" opacity=".72" transform="rotate(-13)"/>
      <ellipse cx="76" cy="-8" rx="78" ry="18" fill="#5e7e8f" opacity=".72" transform="rotate(13)"/>
      <circle cx="-32" cy="-6" r="6" fill="#d8f6ff" opacity=".45"/>
      <circle cx="32" cy="-6" r="6" fill="#d8f6ff" opacity=".45"/>
    </g>
  </defs>
  <rect width="1100" height="460" fill="#0c1118"/>
  <text x="40" y="50" fill="#eef9ff" font-family="Arial, sans-serif" font-size="28" font-weight="700">Flap and Boost Wind VFX</text>
  <text x="40" y="80" fill="#b8ccd5" font-family="Arial, sans-serif" font-size="16">Dedicated visual examples for the two burst actions. They can share wind art ingredients but should be separate authored systems.</text>

  <g transform="translate(40 120)">
    <rect width="500" height="290" rx="10" fill="url(#panelBg)" stroke="#263746"/>
    <rect y="240" width="500" height="50" fill="url(#ground)"/>
    <text x="22" y="36" fill="#eef9ff" font-family="Arial, sans-serif" font-size="21" font-weight="700">Flap: Lift Downwash</text>
    <text x="22" y="62" fill="#b8ccd5" font-family="Arial, sans-serif" font-size="14">Medium-low intensity. Short arcs push downward and slightly outward from wing/body sweep.</text>
    <use href="#drake" x="250" y="126"/>
    <g fill="none" stroke="#dff8ff" stroke-linecap="round" filter="url(#soft)">
      <path d="M126 148c10 62 68 96 132 86" stroke-width="6" opacity=".68"/>
      <path d="M374 148c-10 62-68 96-132 86" stroke-width="6" opacity=".68"/>
      <path d="M160 174c9 42 48 64 96 58" stroke-width="4" opacity=".44"/>
      <path d="M340 174c-9 42-48 64-96 58" stroke-width="4" opacity=".44"/>
      <path d="M202 190c6 26 28 40 58 36" stroke-width="3" opacity=".32"/>
      <path d="M298 190c-6 26-28 40-58 36" stroke-width="3" opacity=".32"/>
    </g>
    <ellipse cx="250" cy="246" rx="128" ry="22" fill="none" stroke="#dff8ff" stroke-width="4" opacity=".22"/>
    <g fill="#c6a36b" opacity=".38">
      <circle cx="170" cy="252" r="4"/>
      <circle cx="222" cy="260" r="3"/>
      <circle cx="310" cy="258" r="4"/>
      <circle cx="360" cy="248" r="3"/>
    </g>
    <text x="22" y="272" fill="#9fb4bf" font-family="Arial, sans-serif" font-size="13">Read: quick upward lift, not a full launch blast.</text>
  </g>

  <g transform="translate(560 120)">
    <rect width="500" height="290" rx="10" fill="url(#panelBg)" stroke="#263746"/>
    <rect y="240" width="500" height="50" fill="url(#ground)"/>
    <text x="22" y="36" fill="#eef9ff" font-family="Arial, sans-serif" font-size="21" font-weight="700">Boost: Horizontal Compression</text>
    <text x="22" y="62" fill="#b8ccd5" font-family="Arial, sans-serif" font-size="14">Medium-high intensity. Punchy forward force cue, shorter and denser than speed trails.</text>
    <g opacity=".78">
      <path d="M42 124h190" stroke="url(#streak)" stroke-width="9" stroke-linecap="round"/>
      <path d="M66 154h226" stroke="url(#streak)" stroke-width="5" stroke-linecap="round"/>
      <path d="M34 184h168" stroke="url(#streak)" stroke-width="4" stroke-linecap="round" opacity=".7"/>
      <path d="M84 104h116" stroke="url(#streak)" stroke-width="3" stroke-linecap="round" opacity=".55"/>
    </g>
    <ellipse cx="218" cy="145" rx="92" ry="30" fill="none" stroke="#dff8ff" stroke-width="4" opacity=".45"/>
    <ellipse cx="198" cy="145" rx="58" ry="20" fill="none" stroke="#ffffff" stroke-width="3" opacity=".28"/>
    <g transform="translate(316 148) rotate(5)">
      <use href="#drake"/>
    </g>
    <g fill="none" stroke="#dff8ff" stroke-linecap="round">
      <path d="M245 115c-60-26-118-18-166 14" stroke-width="4" opacity=".38"/>
      <path d="M245 181c-62 28-122 22-168-8" stroke-width="4" opacity=".38"/>
    </g>
    <path d="M358 114c32 8 58 16 82 28" stroke="#dff8ff" stroke-width="3" opacity=".25" fill="none" stroke-linecap="round"/>
    <path d="M358 184c34-8 62-18 86-32" stroke="#dff8ff" stroke-width="3" opacity=".25" fill="none" stroke-linecap="round"/>
    <text x="22" y="272" fill="#9fb4bf" font-family="Arial, sans-serif" font-size="13">Read: sudden forward thrust, not continuous fast-flight ribboning.</text>
  </g>
</svg>
