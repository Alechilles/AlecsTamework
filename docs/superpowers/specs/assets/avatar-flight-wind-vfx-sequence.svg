<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">AvatarFlight Wind VFX Sequence</title>
  <desc id="desc">Four-panel sequence showing launch charge, launch release, flap, boost, and fast-flight trails.</desc>
  <defs>
    <linearGradient id="panelBg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#101722"/>
      <stop offset=".7" stop-color="#172029"/>
      <stop offset="1" stop-color="#202a24"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#243521"/>
      <stop offset="1" stop-color="#35462b"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#dff8ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".9"/>
    </linearGradient>
    <g id="drake">
      <ellipse cx="0" cy="0" rx="46" ry="18" fill="#2f4858"/>
      <ellipse cx="-44" cy="-5" rx="46" ry="13" fill="#5e7e8f" opacity=".7" transform="rotate(-16)"/>
      <ellipse cx="44" cy="-5" rx="46" ry="13" fill="#5e7e8f" opacity=".7" transform="rotate(16)"/>
    </g>
    <g id="dust">
      <circle cx="-52" cy="4" r="4" fill="#c6a36b" opacity=".55"/>
      <circle cx="-20" cy="12" r="3" fill="#c6a36b" opacity=".5"/>
      <circle cx="28" cy="10" r="4" fill="#c6a36b" opacity=".55"/>
      <circle cx="62" cy="2" r="3" fill="#c6a36b" opacity=".5"/>
    </g>
  </defs>
  <rect width="1200" height="520" fill="#0c1118"/>
  <text x="40" y="52" fill="#eef9ff" font-family="Arial, sans-serif" font-size="28" font-weight="700">AvatarFlight Wind VFX Sequence</text>
  <text x="40" y="82" fill="#b8ccd5" font-family="Arial, sans-serif" font-size="17">Static planning visualization for the living spec. Final particles should use asset-authored systems and model-node attachments.</text>

  <g transform="translate(40 120)">
    <rect width="260" height="330" rx="10" fill="url(#panelBg)" stroke="#263746"/>
    <rect y="276" width="260" height="54" fill="url(#ground)"/>
    <text x="18" y="34" fill="#eef9ff" font-family="Arial, sans-serif" font-size="18" font-weight="700">1. Charge Hold</text>
    <text x="18" y="58" fill="#b8ccd5" font-family="Arial, sans-serif" font-size="13">Inward air pull + dust spiral</text>
    <ellipse cx="130" cy="274" rx="72" ry="18" fill="none" stroke="#dff8ff" stroke-width="3" opacity=".72"/>
    <ellipse cx="130" cy="250" rx="42" ry="11" fill="none" stroke="#dff8ff" stroke-width="2" opacity=".45"/>
    <path d="M72 210c-26-14-38 12-20 27" stroke="#dff8ff" stroke-width="3" fill="none" opacity=".55" stroke-linecap="round"/>
    <path d="M188 210c26-14 38 12 20 27" stroke="#dff8ff" stroke-width="3" fill="none" opacity=".55" stroke-linecap="round"/>
    <use href="#drake" x="130" y="198"/>
    <use href="#dust" x="130" y="286"/>
  </g>

  <g transform="translate(330 120)">
    <rect width="260" height="330" rx="10" fill="url(#panelBg)" stroke="#263746"/>
    <rect y="276" width="260" height="54" fill="url(#ground)"/>
    <text x="18" y="34" fill="#eef9ff" font-family="Arial, sans-serif" font-size="18" font-weight="700">2. Launch Release</text>
    <text x="18" y="58" fill="#b8ccd5" font-family="Arial, sans-serif" font-size="13">Expanding ring + vertical push</text>
    <ellipse cx="130" cy="286" rx="108" ry="24" fill="none" stroke="#dff8ff" stroke-width="4" opacity=".78"/>
    <ellipse cx="130" cy="256" rx="58" ry="13" fill="none" stroke="#ffffff" stroke-width="3" opacity=".52"/>
    <path d="M130 253v-92" stroke="#dff8ff" stroke-width="5" opacity=".42" stroke-linecap="round"/>
    <path d="M112 176l18-30 18 30" fill="none" stroke="#dff8ff" stroke-width="4" opacity=".58" stroke-linecap="round" stroke-linejoin="round"/>
    <use href="#drake" x="130" y="152"/>
    <use href="#dust" x="130" y="296"/>
  </g>

  <g transform="translate(620 120)">
    <rect width="260" height="330" rx="10" fill="url(#panelBg)" stroke="#263746"/>
    <rect y="276" width="260" height="54" fill="url(#ground)"/>
    <text x="18" y="34" fill="#eef9ff" font-family="Arial, sans-serif" font-size="18" font-weight="700">3. Flap Burst</text>
    <text x="18" y="58" fill="#b8ccd5" font-family="Arial, sans-serif" font-size="13">Downwash arcs imply lift</text>
    <use href="#drake" x="130" y="150"/>
    <path d="M62 176c16 42 54 58 96 52" stroke="#dff8ff" stroke-width="4" fill="none" opacity=".68" stroke-linecap="round"/>
    <path d="M198 176c-16 42-54 58-96 52" stroke="#dff8ff" stroke-width="4" fill="none" opacity=".68" stroke-linecap="round"/>
    <path d="M84 205c10 30 40 42 72 38" stroke="#dff8ff" stroke-width="3" fill="none" opacity=".42" stroke-linecap="round"/>
    <path d="M176 205c-10 30-40 42-72 38" stroke="#dff8ff" stroke-width="3" fill="none" opacity=".42" stroke-linecap="round"/>
    <ellipse cx="130" cy="278" rx="70" ry="16" fill="none" stroke="#dff8ff" stroke-width="3" opacity=".32"/>
  </g>

  <g transform="translate(910 120)">
    <rect width="260" height="330" rx="10" fill="url(#panelBg)" stroke="#263746"/>
    <rect y="276" width="260" height="54" fill="url(#ground)"/>
    <text x="18" y="34" fill="#eef9ff" font-family="Arial, sans-serif" font-size="18" font-weight="700">4. Boost + Trails</text>
    <text x="18" y="58" fill="#b8ccd5" font-family="Arial, sans-serif" font-size="13">Horizontal pressure and node trails</text>
    <path d="M24 150h128" stroke="url(#streak)" stroke-width="7" stroke-linecap="round"/>
    <path d="M32 182h158" stroke="url(#streak)" stroke-width="4" stroke-linecap="round" opacity=".75"/>
    <path d="M40 212h112" stroke="url(#streak)" stroke-width="3" stroke-linecap="round" opacity=".55"/>
    <ellipse cx="94" cy="168" rx="58" ry="20" fill="none" stroke="#dff8ff" stroke-width="3" opacity=".42"/>
    <g transform="translate(168 168) rotate(8)">
      <use href="#drake"/>
    </g>
    <path d="M116 147c-40-20-74-12-96 8" stroke="#dff8ff" stroke-width="3" fill="none" opacity=".4" stroke-linecap="round"/>
    <path d="M116 189c-42 22-75 16-98-2" stroke="#dff8ff" stroke-width="3" fill="none" opacity=".4" stroke-linecap="round"/>
  </g>
</svg>
