        uses: actions/github-script@v7
        env:
          TARGET_REPO: AlecsNametags
          TARGET_REF: ${{ github.event.inputs.nametags_ref }}
          TARGET_VERSION: ${{ github.event.inputs.nametags_version }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          PUBLISH_CURSEFORGE: ${{ github.event.inputs.publish_curseforge }}
          PUBLISH_MODTALE: ${{ github.event.inputs.publish_modtale }}
        with:
          github-token: ${{ secrets.RELEASE_BOT_TOKEN }}
          script: |
            const owner = "Alechilles";
            const repo = process.env.TARGET_REPO;
            const ref = process.env.TARGET_REF;
            const version = process.env.TARGET_VERSION;
            const dryRun = process.env.DRY_RUN.toLowerCase();
            const publishCurseForge = process.env.PUBLISH_CURSEFORGE.toLowerCase();
