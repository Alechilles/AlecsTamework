              if (candidates.length > 0) {
                runId = candidates[0].id;
                core.info(`Matched workflow run id ${runId}`);
                break;
              }

              await sleep(pollMs);
            }

            if (!runId) {
              core.setFailed(`Timed out waiting for dispatched run to appear for ${owner}/${repo}.`);
              return;
            }

            while (Date.now() - startedAtMs < timeoutMs) {
              const runResponse = await github.rest.actions.getWorkflowRun({
