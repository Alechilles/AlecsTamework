                  core.setFailed(`Workflow failed for ${owner}/${repo}: ${run.html_url}`);
                }
                return;
              }

              await sleep(pollMs);
            }

            core.setFailed(`Timed out waiting for completion of run ${runId} in ${owner}/${repo}.`);

  summary:
    needs:
      - release-tamework
      - release-cats
      - release-nametags
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        shell: bash
        run: |
          echo "Release train complete."
          echo "Tamework run: ${{ needs.release-tamework.outputs.run_url }}"
          echo "Cats run: ${{ needs.release-cats.outputs.run_url }}"
          echo "Nametags run: ${{ needs.release-nametags.outputs.run_url }}"
