name: Central Publish Handoff

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, with or without the v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-handoff-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify GitHub Release for central publishing
    runs-on: ubuntu-latest
    steps:
      - name: Verify release handoff contract
        uses: actions/github-script@v8
        env:
          MOD_KEY: alecs-tamework
          ARTIFACT_TEMPLATE: "Alec's Tamework! v{version}.jar"
          RELEASE_VERSION: ${{ inputs.version }}
          PUBLISHER_REPOSITORY: Alechilles/mod-release-publisher
        with:
          script: |
            const path = require("path");
            const version = process.env.RELEASE_VERSION.trim().replace(/^v/, "");
            if (!version || /[\\/]/.test(version)) {
              core.setFailed("Provide a valid release version.");
              return;
            }

            const [owner, repo] = process.env.GITHUB_REPOSITORY.split("/");
            const tag = `v${version}`;
            const expectedName = process.env.ARTIFACT_TEMPLATE.replace("{version}", version);
            const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });

            if (release.draft || release.prerelease) {
              core.setFailed(`${tag} must be a published stable GitHub Release.`);
              return;
            }
            if (!release.body || !release.body.trim()) {
              core.setFailed(`${tag} must contain release notes.`);
              return;
            }

            const normalize = (name) => {
              const extension = path.extname(name).toLowerCase();
              const base = path.basename(name, extension).replace(/[^A-Za-z0-9]+/g, ".").replace(/^\.+|\.+$/g, "");
              return `${base}${extension}`;
            };
            const asset = release.assets.find((candidate) =>
              candidate.label === expectedName ||
              candidate.name === expectedName ||
              normalize(candidate.name) === normalize(expectedName)
            );
            if (!asset) {
              core.setFailed(`${tag} does not contain ${expectedName}.`);
              return;
            }

            const command = [
              "gh workflow run publish.yml \\",
              `  --repo ${process.env.PUBLISHER_REPOSITORY} \\`,
              `  -f mod=${process.env.MOD_KEY} \\`,
              `  -f version=${version} \\`,
              "  -f dry_run=true"
            ].join("\n");

            await core.summary
              .addHeading("Central publisher handoff")
              .addTable([
                [{ data: "Field", header: true }, { data: "Value", header: true }],
                ["Source release", release.html_url],
                ["Artifact", asset.label || asset.name],
                ["Publisher mod key", process.env.MOD_KEY]
              ])
              .addHeading("Next command", 2)
              .addCodeBlock(command, "bash")
              .addLink("Open the private publisher workflow", `https://github.com/${process.env.PUBLISHER_REPOSITORY}/actions/workflows/publish.yml`)
              .write();
